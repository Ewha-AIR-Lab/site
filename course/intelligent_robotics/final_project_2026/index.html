<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Project Showcase 2026 — ARI Lab @ Ewha</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'IBM Plex Sans', sans-serif; background: #f5f6f8; color: #0f172a; min-height: 100vh; }

/* ── Topbar breadcrumb ── */
.topbar { background: white; border-bottom: 1px solid #e2e8f0; padding: .7rem 1.5rem; display: flex; align-items: center; gap: .5rem; font-size: .84rem; flex-wrap: wrap; }
.topbar a { text-decoration: none; color: #00462A; font-weight: 500; }
.topbar a:hover { text-decoration: underline; }
.topbar .sep { color: #94a3b8; }
.topbar .cur { color: #0f172a; font-weight: 600; }

/* ── Page ── */
.page { max-width: 1440px; margin: 0 auto; padding: 1.5rem; }
.page-title { font-size: 1.75rem; font-weight: 700; margin-bottom: .4rem; }
.page-desc { color: #64748b; font-size: .9rem; max-width: 760px; margin-bottom: 1rem; line-height: 1.6; }

/* ── Toolbar ── */
.toolbar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.search { flex: 1 1 260px; max-width: 360px; position: relative; }
.search input {
  width: 100%; padding: .55rem .9rem .55rem 2.1rem; font-size: .88rem; font-family: inherit;
  border: 1px solid #e2e8f0; border-radius: 10px; background: white; outline: none; color: #0f172a;
}
.search input:focus { border-color: #00462A; box-shadow: 0 0 0 3px rgba(0,70,42,.08); }
.search svg { position: absolute; left: .65rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #94a3b8; }
.count { font-size: .82rem; color: #64748b; }
.count b { color: #00462A; font-weight: 600; }

/* ── Grid ── */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }

/* ── Card ── */
.card { background: white; border: 1px solid #e2e8f0; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
.card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.10); transform: translateY(-2px); }

.video-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #0f172a; overflow: hidden; }
.video-wrap.has-video { cursor: pointer; }
/* baseline zoom crops the letterbox bars baked into many sim-recording thumbnails */
.thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; filter: grayscale(.2); transform: scale(1.11); transition: transform .25s, filter .25s; }
.video-wrap:hover .thumb { transform: scale(1.2); filter: grayscale(0); }
.play-btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 54px; height: 54px; border-radius: 50%; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; opacity: .85; transition: background .15s, transform .15s, opacity .15s; pointer-events: none; z-index: 2; }
.video-wrap:hover .play-btn { background: #00462A; opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
.play-btn svg { width: 22px; height: 22px; fill: #fff; margin-left: 3px; }
.multi-badge { position: absolute; top: .55rem; right: .55rem; display: inline-flex; align-items: center; gap: .25rem; font-size: .72rem; font-weight: 600; color: #fff; background: rgba(0,0,0,.6); padding: .2rem .5rem; border-radius: 999px; z-index: 2; }
.multi-badge svg { width: 12px; height: 12px; fill: #fff; }
.video-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem; color: #94a3b8; background: #f1f5f9; font-size: .82rem; }
.video-empty svg { width: 30px; height: 30px; }

.card-body { padding: .8rem 1.1rem 1rem; display: flex; flex-direction: column; gap: .35rem; }
.team-row { display: flex; align-items: center; gap: .5rem; }
.team-badge { font-size: .82rem; font-weight: 600; color: #00462A; background: rgba(0,70,42,.08); padding: .18rem .6rem; border-radius: 999px; white-space: nowrap; }
.team-badge.team-na { color: #94a3b8; background: #f1f5f9; }
.topic { font-size: .92rem; font-weight: 500; line-height: 1.45; color: #0f172a; }
.topic-na { color: #94a3b8; font-style: italic; font-weight: 400; }

.empty-msg { grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 3rem 1rem; font-size: .9rem; }

/* ── Modal / lightbox ── */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 50; padding: 1.5rem; }
.modal.open { display: flex; }
.modal-inner { width: 100%; max-width: 960px; }
.modal-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
.modal-meta { color: #e2e8f0; font-size: .92rem; line-height: 1.4; }
.modal-team { color: #9ae6b4; font-weight: 600; margin-right: .5rem; }
.modal-close { background: none; border: none; color: #fff; font-size: 1.7rem; line-height: 1; cursor: pointer; padding: 0 .25rem; opacity: .8; flex-shrink: 0; }
.modal-close:hover { opacity: 1; }
.modal-video { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; overflow: hidden; }
.modal-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.modal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(0,0,0,.55); color: #fff; font-size: 1.5rem; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; transition: background .15s; }
.modal-nav:hover { background: rgba(239,0,0,.85); }
.modal-nav.prev { left: .6rem; }
.modal-nav.next { right: .6rem; }
.modal-nav[hidden] { display: none; }
.modal-counter { margin-top: .55rem; text-align: center; color: #cbd5e1; font-size: .82rem; }
.modal-counter[hidden] { display: none; }

@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) {
  .topbar { padding: .6rem 1rem; font-size: .78rem; }
  .page { padding: 1rem; }
  .page-title { font-size: 1.3rem; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── Topbar breadcrumb ── -->
<div class="topbar" id="course-nav"></div>
<script src="../nav.js"></script>

<!-- ── Page ── -->
<div class="page">
  <h1 class="page-title">Final Project Showcase — 2026</h1>
  <p class="page-desc">지능형로보틱스 최종 프로젝트 모음. 썸네일을 클릭하면 발표 영상이 재생됩니다.</p>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="팀명 또는 주제 검색…" autocomplete="off">
    </div>
    <div class="count" id="count"></div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<!-- ── Video modal ── -->
<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-bar">
      <div class="modal-meta"><span class="modal-team" id="mTeam"></span><span id="mTopic"></span></div>
      <button class="modal-close" id="mClose" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-video">
      <button class="modal-nav prev" id="mPrev" aria-label="이전 영상" hidden>&#8249;</button>
      <div id="mVideo" style="position:absolute;inset:0;"></div>
      <button class="modal-nav next" id="mNext" aria-label="다음 영상" hidden>&#8250;</button>
    </div>
    <div class="modal-counter" id="mCounter" hidden></div>
  </div>
</div>

<script src="projects.js"></script>
<script>
// Parse the youtube field into an array of video IDs (supports comma-separated multiple links).
function ytIds(field) {
  if (!field) return [];
  return field.split(',')
    .map(s => { const m = s.match(/(?:youtu\.be\/|[?&]v=|\/embed\/)([\w-]{11})/); return m ? m[1] : ''; })
    .filter(Boolean);
}
function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
const qEl = document.getElementById('q');
const modal = document.getElementById('modal');
const mVideo = document.getElementById('mVideo');
const mTeam = document.getElementById('mTeam');
const mTopic = document.getElementById('mTopic');
const mPrev = document.getElementById('mPrev');
const mNext = document.getElementById('mNext');
const mCounter = document.getElementById('mCounter');

const PLAY_SVG = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

function cardHTML(p) {
  const ids = ytIds(p.youtube);
  const id = ids[0];
  const multi = ids.length > 1
    ? `<div class="multi-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>영상 ${ids.length}개</div>` : '';
  const video = id
    ? `<div class="video-wrap has-video" data-ids="${ids.join(',')}" data-team="${esc(p.team)}" data-topic="${esc(p.topic)}">
         <img class="thumb" src="https://img.youtube.com/vi/${id}/maxresdefault.jpg" data-id="${id}" alt="${esc(p.team)} 발표 영상 썸네일" loading="lazy"
              onload="if(!this.dataset.fb&&this.naturalWidth<=120){this.dataset.fb=1;this.src='https://img.youtube.com/vi/'+this.dataset.id+'/hqdefault.jpg';}"
              onerror="this.onerror=null;this.src='https://img.youtube.com/vi/'+this.dataset.id+'/hqdefault.jpg'">
         <div class="play-btn">${PLAY_SVG}</div>
         ${multi}
       </div>`
    : `<div class="video-wrap"><div class="video-empty">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg>
         미제출 / 영상 없음</div></div>`;
  const topic = p.topic
    ? `<div class="topic">${esc(p.topic)}</div>`
    : `<div class="topic topic-na">프로젝트 미제출</div>`;
  return `<div class="card">
    ${video}
    <div class="card-body">
      <div class="team-row"><span class="team-badge${id ? '' : ' team-na'}">${esc(p.team)}</span></div>
      ${topic}
    </div>
  </div>`;
}

const sorted = PROJECTS.slice().sort((a, b) => a.team.localeCompare(b.team, 'ko'));

function render(filter) {
  const f = (filter || '').trim().toLowerCase();
  const rows = sorted.filter(p =>
    !f || p.team.toLowerCase().includes(f) || (p.topic || '').toLowerCase().includes(f));
  grid.innerHTML = rows.length
    ? rows.map(cardHTML).join('')
    : `<div class="empty-msg">검색 결과가 없습니다.</div>`;
  countEl.innerHTML = f
    ? `${rows.length}개 표시 중`
    : `총 <b>${sorted.length}</b>개 팀`;
}

// ── Modal with multi-video navigation ──
let curIds = [], curIdx = 0;

function showVideo(i) {
  curIdx = (i + curIds.length) % curIds.length;
  mVideo.innerHTML = `<iframe src="https://www.youtube.com/embed/${curIds[curIdx]}?autoplay=1&rel=0" title="${esc(mTeam.textContent)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
  const many = curIds.length > 1;
  mPrev.hidden = mNext.hidden = mCounter.hidden = !many;
  if (many) mCounter.textContent = `영상 ${curIdx + 1} / ${curIds.length}`;
}
function openModal(ids, team, topic) {
  curIds = ids;
  mTeam.textContent = team;
  mTopic.textContent = topic;
  showVideo(0);
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  modal.classList.remove('open');
  mVideo.innerHTML = '';                        // stop playback
  document.body.style.overflow = '';
}

grid.addEventListener('click', e => {
  const w = e.target.closest('.video-wrap.has-video');
  if (!w) return;
  openModal(w.dataset.ids.split(','), w.dataset.team, w.dataset.topic);
});
mPrev.addEventListener('click', () => showVideo(curIdx - 1));
mNext.addEventListener('click', () => showVideo(curIdx + 1));
document.getElementById('mClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft' && curIds.length > 1) showVideo(curIdx - 1);
  else if (e.key === 'ArrowRight' && curIds.length > 1) showVideo(curIdx + 1);
});

qEl.addEventListener('input', () => render(qEl.value));
render('');
</script>
</body>
</html>
